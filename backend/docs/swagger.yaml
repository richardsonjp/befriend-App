definitions:
  api.Base:
    properties:
      data: {}
    type: object
  api.Error:
    properties:
      code:
        type: integer
      details:
        items:
          $ref: '#/definitions/constant.ErrorDetails'
        type: array
      message:
        type: string
    type: object
  api.Message:
    properties:
      message:
        type: string
    type: object
  authentication.AuthenticateSessionResponse:
    properties:
      expired_at:
        type: string
      frontend_path:
        items:
          type: string
        type: array
      profile:
        $ref: '#/definitions/authentication.UserProfile'
      sid:
        type: string
    type: object
  authentication.FrontendPathResponse:
    properties:
      frontend_path:
        items:
          type: string
        type: array
    type: object
  authentication.HomeProfile:
    properties:
      role:
        $ref: '#/definitions/role.RoleResponse'
      user:
        $ref: '#/definitions/user.UserResponse'
    type: object
  authentication.Signin:
    properties:
      email:
        maxLength: 50
        minLength: 8
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  authentication.UserProfile:
    properties:
      email:
        type: string
      name:
        type: string
      phone:
        type: string
    type: object
  constant.ErrorDetails:
    properties:
      key:
        type: string
      value: {}
    type: object
  role.RoleResponse:
    properties:
      id:
        type: integer
      name:
        type: string
      status:
        type: string
    type: object
  transformer.Meta:
    properties:
      meta_data: {}
      pagination:
        $ref: '#/definitions/transformer.PaginationMeta'
    type: object
  transformer.Pagination:
    properties:
      data: {}
      meta:
        $ref: '#/definitions/transformer.Meta'
    type: object
  transformer.PaginationMeta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      sort:
        type: string
      total_pages:
        type: integer
      total_rows:
        type: integer
    type: object
  user.UserListResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      last_login_at:
        type: string
      name:
        type: string
      phone:
        type: string
      role_name:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  user.UserResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      phone:
        type: string
      role_id:
        type: integer
      status:
        type: string
    type: object
host: localhost:7000
info:
  contact: {}
  description: Antartech API documentation
  title: Antartech API
  version: "1.0"
paths:
  /auth/frontend-path:
    get:
      description: Retrieve frontend routing path for user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Base'
            - properties:
                data:
                  $ref: '#/definitions/authentication.FrontendPathResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Error'
      security:
      - StaticApiKey: []
      - ApiKeyAuth: []
      summary: Get frontend path
      tags:
      - Authentication
  /auth/home-profile:
    get:
      description: Retrieve user's home profile information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Base'
            - properties:
                data:
                  $ref: '#/definitions/authentication.HomeProfile'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Error'
      security:
      - StaticApiKey: []
      - ApiKeyAuth: []
      summary: Get home profile
      tags:
      - Authentication
  /auth/logout:
    post:
      description: Invalidate user session
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Message'
            - properties:
                message:
                  type: string
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Error'
      security:
      - StaticApiKey: []
      - ApiKeyAuth: []
      summary: User logout
      tags:
      - Authentication
  /auth/signin:
    post:
      consumes:
      - application/json
      description: Authenticate user and return token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/authentication.Signin'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Base'
            - properties:
                data:
                  $ref: '#/definitions/authentication.AuthenticateSessionResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Error'
      security:
      - StaticApiKey: []
      summary: User sign in
      tags:
      - Authentication
  /dashboard/user:
    get:
      consumes:
      - application/json
      description: Retrieves users information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Base'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/transformer.Pagination'
                  - properties:
                      data:
                        items:
                          $ref: '#/definitions/user.UserListResponse'
                        type: array
                    type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Error'
      security:
      - STATIC-API-KEY: []
      - Authorization: []
      summary: Get list of users
      tags:
      - user
  /ping:
    get:
      description: Check if API is running
      produces:
      - application/json
      responses:
        "200":
          description: '{"message": "pong"}'
          schema:
            properties:
              message:
                type: string
            type: object
      summary: Health check
      tags:
      - System
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
  StaticApiKey:
    in: header
    name: STATIC-API-KEY
    type: apiKey
swagger: "2.0"
